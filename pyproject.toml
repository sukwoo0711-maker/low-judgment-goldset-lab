[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "low-judgment-goldset-lab"
version = "0.1.0"
description = "Offline-first low-judgment retrieval evaluation lab"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
goldset-lab = "goldset_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
